# ale_claw + Qwen3.8-Flash on business_finance/odoo_branch, variant 0 (branching).
# Run both variants with ../../tasks/odoo/run_branch_experiment.sh (scores each run
# before the next one's setup resets the database).
name: odoo_branch_branching_qwen_flash

secret_file: secret/.env

agents:
  - configs/agents/ale_claw_qwen_flash.yaml
environment: configs/environments/local_odoo_docker.yaml

tasks: selected_tasks/odoo_branch_v0.yaml

output:
  root: .logs/ale
concurrency: 1
wall_time_s: 7200
auto_resume: false
max_attempts: 1
cleanup_mode: keep

prompt_suffix: |
  Complete the task fully autonomously; no user will intervene.
  When finished, terminate all child processes you started.
  The user will evaluate your performance based on your delivered artifacts.

# ale_claw + Qwen3.8-Max on the local arm64 port of business_finance/odoo.
# No cloud provider: the sandbox, Odoo and Postgres run in docker on this machine.
#
#     (cd ../../stack && docker compose up -d)   # odoo + db; ALE starts the sandbox per run
#     uv run python -m ale_run run odoo_local_qwen_exp.yaml --dry-run
#     uv run python -m ale_run run odoo_local_qwen_exp.yaml
#     (cd ../../tasks/odoo && uv run python report.py <label>)   # residue score

name: odoo_local_ale_claw_qwen

secret_file: secret/.env

agents:
  - configs/agents/ale_claw_qwen.yaml
environment: configs/environments/local_odoo_docker.yaml

tasks: selected_tasks/odoo_local.txt

output:
  root: .logs/ale
concurrency: 1           # one sandbox, one run at a time
wall_time_s: 7200
auto_resume: false       # every invocation is a fresh trial (setup resets odoo_compact)
max_attempts: 1          # a retry would reset odoo_compact and erase the residue
cleanup_mode: keep

prompt_suffix: |
  Complete the task fully autonomously; no user will intervene.
  When finished, terminate all child processes you started.
  The user will evaluate your performance based on your delivered artifacts.

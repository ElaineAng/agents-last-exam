# ale_claw + Qwen3.8-Flash on business_finance/metabase_local, variant 0 (branching).
# Run both variants with ../../tasks/metabase/run_experiment.sh (scores each run
# before the next one's setup resets the database).
name: metabase_local_branching_dummy_smoke

secret_file: secret/.env

agents:
  - configs/agents/dummy.yaml
environment: configs/environments/local_odoo_docker.yaml

tasks: selected_tasks/metabase_local_v0.yaml

output:
  root: .logs/ale
concurrency: 1
wall_time_s: 600
auto_resume: false
max_attempts: 1
cleanup_mode: keep

prompt_suffix: |
  Complete the task fully autonomously; no user will intervene.
  When finished, terminate all child processes you started.
  The user will evaluate your performance based on your delivered artifacts.
